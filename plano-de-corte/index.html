<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gama Pro | Otimizador de Corte para CNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* CSS PROFISSIONAL INTEGRADO - GAMA PRO */
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #14141f;
            --border: #2a2a3e;
            --accent: #00b4d8;
            --text: #ffffff;
            --text-dim: #a0a0b0;
            --gradient: linear-gradient(135deg, #00b4d8, #0077b6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text); line-height: 1.6; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* HEADER */
        .site-header { padding: 1.5rem 0; border-bottom: 1px solid var(--border); background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.5rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* HERO BANNER */
        .hero { padding: 80px 0; background: linear-gradient(rgba(10,10,15,0.8), rgba(10,10,15,0.8)), url('https://images.unsplash.com/photo-1581092160562-40aa08e78837?q=80&w=1470&auto=format&fit=crop'); background-size: cover; background-position: center; text-align: center; border-bottom: 2px solid var(--accent); }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { color: var(--text-dim); max-width: 600px; margin: 0 auto 2rem; }

        /* GRID DO OTIMIZADOR */
        .optimizer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: -50px; }
        .panel { background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border); padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        /* FORMULÁRIO */
        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; font-weight: 700; }
        input { width: 100%; padding: 12px; background: #0a0a0f; border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; }
        
        .thickness-selector { display: flex; gap: 10px; }
        .thickness-option { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: white; cursor: pointer; }
        .thickness-option.active { background: var(--gradient); border: none; }

        .btn-add-part { width: 100%; padding: 15px; background: transparent; border: 1px dashed var(--accent); color: var(--accent); border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; }
        .btn-optimize { width: 100%; padding: 18px; background: var(--gradient); border: none; color: white; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 1rem; margin-top: 20px; }

        /* TABELA */
        .parts-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .parts-table th { text-align: left; color: var(--text-dim); font-size: 0.7rem; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .parts-table td { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        /* LOADING */
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(0,180,216,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 900px) { .optimizer-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 2rem; } }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <div class="logo">GAMA PRO</div>
                <nav style="display: flex; gap: 20px;">
                    <a href="https://gamamoveisplanejados.com.br" style="color: white; text-decoration: none; font-size: 0.8rem;">VOLTAR AO SITE</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Otimização de Corte CNC</h1>
            <p>Aumente a produtividade da sua marcenaria com nesting inteligente e desperdício zero.</p>
        </div>
    </section>

    <main class="container" id="optimizer">
        <div class="optimizer-grid">
            <!-- Coluna de Configuração -->
            <div class="panel">
                <div class="control-group">
                    <label>Espessura do MDF</label>
                    <div class="thickness-selector">
                        <button class="thickness-option" data-thickness="6">6mm</button>
                        <button class="thickness-option" data-thickness="15">15mm</button>
                        <button class="thickness-option active" data-thickness="18">18mm</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Fresa / Serra (mm): <span id="bladeValue">3.0 mm</span></label>
                    <input type="range" id="bladeThickness" min="0" max="10" step="0.5" value="3" style="width: 100%;">
                </div>

                <div class="control-group">
                    <label>Chapa (Largura x Altura)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="sheetWidth" value="2750">
                        <input type="number" id="sheetHeight" value="1850">
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

                <div class="control-group">
                    <label>Adicionar Peça</label>
                    <input type="text" id="partName" placeholder="Nome da peça (ex: Lateral)" style="margin-bottom: 10px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                        <input type="number" id="partWidth" placeholder="Base">
                        <input type="number" id="partHeight" placeholder="Altura">
                        <input type="number" id="partQuantity" value="1">
                    </div>
                    <button id="addPartBtn" class="btn-add-part">+ Adicionar à Lista</button>
                </div>
            </div>

            <!-- Coluna de Lista -->
            <div class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 1rem;">Lista de Produção</h3>
                    <span id="partsCount" style="background: var(--accent); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem;">0</span>
                </div>
                <div id="partsTable" class="parts-list-container">
                    <!-- O script preencherá aqui -->
                </div>
                <button id="optimizeBtn" class="btn-optimize">⚡ GERAR PLANO DE CORTE</button>
            </div>
        </div>

        <div id="resultDisplay" style="margin-top: 50px;"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
