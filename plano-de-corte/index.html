<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gama Pro | Otimizador de Corte</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- Header & Nav -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">GAMA<span>PRO</span></div>
            <div class="nav-links">
                <a href="#ferramenta">Ferramenta</a>
                <a href="https://gamamoveisplanejados.com.br">Voltar ao Site</a>
            </div>
        </div>
    </nav>

    <!-- Banner Principal -->
    <section class="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Otimização de Precisão</h1>
            <p>Tecnologia avançada em nesting para marcenarias de alto desempenho.</p>
        </div>
    </section>

    <main class="container" id="ferramenta">
        <div class="main-grid">
            <!-- Painel de Configurações -->
            <aside class="config-panel">
                <div class="card">
                    <h3><span class="icon">⚙️</span> Configurações</h3>
                    
                    <div class="input-group">
                        <label>Material & Espessura</label>
                        <div class="thickness-tabs">
                            <button class="tab-opt" data-thickness="6">6mm</button>
                            <button class="tab-opt" data-thickness="15">15mm</button>
                            <button class="tab-opt active" data-thickness="18">18mm</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Fresa / Serra (mm): <span id="bladeValue">3.0</span></label>
                        <input type="range" id="bladeThickness" min="0" max="10" step="0.5" value="3">
                    </div>

                    <div class="input-group">
                        <label>Dimensões da Chapa (mm)</label>
                        <div class="flex-inputs">
                            <input type="number" id="sheetWidth" value="2750">
                            <span>×</span>
                            <input type="number" id="sheetHeight" value="1850">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3><span class="icon">➕</span> Nova Peça</h3>
                    <div class="part-form">
                        <input type="text" id="partName" placeholder="Identificação da peça">
                        <div class="flex-inputs">
                            <input type="number" id="partWidth" placeholder="Base">
                            <input type="number" id="partHeight" placeholder="Altura">
                            <input type="number" id="partQuantity" value="1">
                        </div>
                        <button id="addPartBtn" class="btn-add">Adicionar à Lista</button>
                    </div>
                </div>
            </aside>

            <!-- Painel de Lista e Resultados -->
            <section class="content-panel">
                <div class="card">
                    <div class="card-header">
                        <h3>Lista de Peças</h3>
                        <div class="actions">
                            <button id="optimizeBtn" class="btn-primary">Gerar Plano de Corte</button>
                            <button id="newCalcBtn" class="btn-outline">Limpar</button>
                        </div>
                    </div>
                    <div id="partsTable" class="table-container">
                        <p class="empty-msg">Nenhuma peça adicionada ainda.</p>
                    </div>
                </div>

                <!-- Onde o plano aparece -->
                <div id="resultDisplay" class="result-area"></div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
